<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Mein Training</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f3f6fa;background:#10151e}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 90px}header{padding:24px 20px 12px}h1{font-size:27px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}p,small{color:#a5b0c2}.sub{font-size:13px}main{padding:0 16px}.card{background:#1c2532;border:1px solid #303c4b;border-radius:17px;padding:16px;margin:12px 0}.muted{color:#a5b0c2}.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plan{border:1px solid #3c4c5d;background:#1c2532;color:#fff;text-align:left;padding:15px;border-radius:14px;min-height:85px;font-weight:700}.plan span{display:block;font-size:12px;font-weight:400;color:#9eafc4;margin-top:7px}button{font:inherit;cursor:pointer}button.primary{background:#9ee6bd;color:#102016;border:0;border-radius:12px;padding:12px 16px;font-weight:750}button.secondary{background:#303d4c;color:white;border:0;border-radius:10px;padding:10px}button.danger{color:#ff9d9d}.setrow{display:grid;grid-template-columns:26px 1fr 1fr 45px;align-items:center;gap:8px;margin:10px 0}.setrow input,.field{min-width:0;width:100%;background:#101924;border:1px solid #46576b;border-radius:10px;padding:12px 7px;color:#fff;font-size:17px;text-align:center}.setrow button{border:1px solid #5e7185;border-radius:9px;background:#253342;color:#fff;height:42px}.setrow button.done{background:#2e7756;border-color:#77cda0}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:12px;background:#304355;color:#c7d8eb;border-radius:7px;padding:5px 7px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#1b2531;border-top:1px solid #354254;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:2}.nav button{border:0;background:none;color:#9eafc4;font-size:12px;padding:7px 0}.nav button.active{color:#9ee6bd;font-weight:800}.hidden{display:none}.stack{display:grid;gap:9px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#1c2532;border-radius:14px;padding:15px}.stat b{display:block;font-size:24px;margin-top:7px}input[type=date]{color-scheme:dark}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}hr{border:0;border-top:1px solid #344255;margin:15px 0}details summary{cursor:pointer;font-weight:650}canvas{width:100%;height:180px}.empty{padding:20px;text-align:center;color:#a5b0c2}
</style></head><body><header><h1>Mein Training <span style="color:#9ee6bd">●</span></h1><div class="sub muted">Dein persönlicher Trainingsbegleiter</div></header><main id="app"></main><nav class="nav"><button data-tab="train" class="active">🏋️<br>Training</button><button data-tab="history">📅<br>Verlauf</button><button data-tab="progress">📈<br>Fortschritt</button><button data-tab="food">🥗<br>Ernährung</button></nav><script src="data.js"></script><script>
const KEY='my-training-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!state.plans)state={plans:SEED.plans,history:SEED.history,nutrition:SEED.nutrition,sessions:[],draft:null};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));save();let tab='train';const app=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');const datefmt=x=>{if(!x)return 'Ohne Datum';let d=String(x);if(/^\d\d\.\d\d\.\d\d$/.test(d))return d;try{return new Date(d).toLocaleDateString('de-DE')}catch{return d}};function latest(plan,name){return [...state.sessions.filter(s=>s.plan===plan).flatMap(s=>s.exercises.filter(e=>e.name===name).map(e=>({date:s.date,sets:e.sets}))),...state.history.filter(h=>h.plan===plan&&h.exercise===name)].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='train')train();if(tab==='history')history();if(tab==='progress')progress();if(tab==='food')food()}
function train(){if(!state.draft){app.innerHTML='<h2>Training starten</h2><div class="plans">'+Object.entries(state.plans).map(([k,v])=>`<button class="plan" data-plan="${esc(k)}">${esc(k)}<span>${v.length} Übungen</span></button>`).join('')+'</div><p class="sub">Deine bisherigen Trainingswerte sind bereits importiert. Wähle eine Einheit, um loszulegen.</p>';document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{let p=b.dataset.plan;state.draft={plan:p,date:today(),exercises:state.plans[p].map(e=>{let prev=latest(p,e.name);return {...e,sets:Array.from({length:e.sets},(_,i)=>({kg:prev?.sets[i]?.kg??0,reps:prev?.sets[i]?.reps??'',done:false}))}})};save();render()});return}
let d=state.draft;app.innerHTML=`<div class="topline"><h2>${esc(d.plan)}</h2><span class="tag">${datefmt(d.date)}</span></div><p class="sub">Werte der letzten Einheit sind vorausgefüllt. Nach jedem Satz auf ✓ tippen.</p>`+d.exercises.map((e,i)=>{let prev=latest(d.plan,e.name);return `<section class="card"><div class="topline"><b>${i+1}. ${esc(e.name)}</b><span class="tag">${esc(e.target)}</span></div><div class="sub muted" style="margin-top:8px">Pause: ${esc(e.rest)} · Zuletzt: ${prev?prev.sets.map(s=>esc(s.kg)+' kg × '+esc(s.reps)).join(' / '):'–'}</div><div class="setrow sub muted"><span></span><span style="text-align:center">kg / +kg</span><span style="text-align:center">Wdh. / s</span><span></span></div>`+e.sets.map((s,j)=>`<div class="setrow"><span class="muted">${j+1}</span><input inputmode="decimal" aria-label="Gewicht Satz ${j+1}" data-i="${i}" data-j="${j}" data-f="kg" value="${esc(s.kg)}"><input inputmode="decimal" aria-label="Wiederholungen Satz ${j+1}" data-i="${i}" data-j="${j}" data-f="reps" value="${esc(s.reps)}"><button class="${s.done?'done':''}" data-done="${i}-${j}">✓</button></div>`).join('')+`</section>`}).join('')+`<div class="row"><button class="primary" id="finish">Training abschließen</button><button class="secondary danger" id="discard">Verwerfen</button></div>`;document.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{let s=d.exercises[+el.dataset.i].sets[+el.dataset.j];let v=el.value.replace(',','.');s[el.dataset.f]=v===''?'':Number(v);save()});document.querySelectorAll('[data-done]').forEach(el=>el.onclick=()=>{let [i,j]=el.dataset.done.split('-').map(Number);d.exercises[i].sets[j].done=!d.exercises[i].sets[j].done;save();el.classList.toggle('done')});document.querySelector('#finish').onclick=()=>{if(!confirm('Trainingseinheit speichern und abschließen?'))return;state.sessions.push(d);state.draft=null;save();tab='history';render()};document.querySelector('#discard').onclick=()=>{if(confirm('Aktuelle Eingaben wirklich verwerfen?')){state.draft=null;save();render()}}}
function history(){let sessions=[...state.sessions.map(s=>({date:s.date,plan:s.plan,exercises:s.exercises.map(e=>({name:e.name,sets:e.sets}))})),...Object.entries(Object.groupBy(state.history,h=>h.plan+'|'+h.date)).map(([k,rows])=>({date:rows[0].date,plan:rows[0].plan,exercises:rows.map(r=>({name:r.exercise,sets:r.sets}))}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));app.innerHTML='<h2>Trainingshistorie</h2><p class="sub">Importierte und neu erfasste Einheiten</p>'+sessions.map(s=>`<details class="card"><summary>${esc(s.plan)} <span class="muted">· ${datefmt(s.date)}</span></summary><hr>${s.exercises.map(e=>`<div style="margin:10px 0"><b>${esc(e.name)}</b><div class="sub muted">${e.sets.map(x=>`${esc(x.kg)} kg × ${esc(x.reps)}`).join(' · ')}</div></div>`).join('')}</details>`).join('')}
function progress(){let entries=[...state.history.map(h=>({name:h.exercise,date:h.date,sets:h.sets})),...state.sessions.flatMap(s=>s.exercises.map(e=>({name:e.name,date:s.date,sets:e.sets})))];let names=[...new Set(entries.map(e=>e.name))].sort();app.innerHTML=`<h2>Fortschritt</h2><div class="stats"><div class="stat">Erfasste Übungen<b>${entries.length}</b></div><div class="stat">Trainingstage<b>${new Set(entries.map(e=>e.date)).size}</b></div></div><section class="card"><h2>Übungsverlauf</h2><select id="ex" class="field" style="text-align:left">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><p class="sub">Höchstes eingetragenes Zusatz-/Trainingsgewicht pro Einheit</p><canvas id="chart" width="600" height="260"></canvas></section><section class="card"><h2>Datensicherung</h2><p class="sub">Speichere regelmäßig eine Sicherung deiner gesamten Daten. Lokale Browserdaten können verloren gehen.</p><div class="stack"><button class="primary" id="backup">Backup herunterladen (JSON)</button><button class="secondary" id="csv">Trainingsdaten als CSV exportieren</button><label class="secondary" style="padding:12px;border-radius:10px">Backup wiederherstellen <input type="file" id="restore" accept=".json" style="width:100%;margin-top:8px"></label></div></section>`;const draw=()=>{let n=document.querySelector('#ex').value;let pts=entries.filter(e=>e.name===n).map(e=>({date:e.date,val:Math.max(...e.sets.map(s=>Number(s.kg)||0))})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));let c=document.querySelector('#chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,600,260);ctx.fillStyle='#a5b0c2';ctx.font='22px system-ui';if(!pts.length)return;let max=Math.max(1,...pts.map(p=>p.val));ctx.fillText(max+' kg',12,30);ctx.fillText('0 kg',12,235);ctx.strokeStyle='#344c60';ctx.beginPath();ctx.moveTo(80,25);ctx.lineTo(80,230);ctx.lineTo(580,230);ctx.stroke();ctx.strokeStyle='#9ee6bd';ctx.lineWidth=4;ctx.beginPath();pts.forEach((p,i)=>{let x=80+(pts.length===1?250:i*500/(pts.length-1)),y=230-p.val/max*185;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()};document.querySelector('#ex').onchange=draw;draw();document.querySelector('#backup').onclick=()=>download('training-backup.json',JSON.stringify(state,null,2),'application/json');document.querySelector('#csv').onclick=()=>{let lines=['Datum;Plan;Übung;Satz;Gewicht;Wiederholungen'];[...state.history,...state.sessions.flatMap(s=>s.exercises.map(e=>({date:s.date,plan:s.plan,exercise:e.name,sets:e.sets})))].forEach(h=>h.sets.forEach((s,i)=>lines.push([h.date,h.plan,h.exercise,i+1,s.kg,s.reps].map(v=>String(v??'').replaceAll(';',',')).join(';'))));download('training.csv','\ufeff'+lines.join('\n'),'text/csv')};document.querySelector('#restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.plans||!v.history||!v.sessions)throw Error('Ungültige Sicherung');if(confirm('Aktuelle App-Daten durch das Backup ersetzen?')){state=v;save();render()}}catch(e){alert('Backup konnte nicht geladen werden: '+e.message)}}}
function food(){let n=state.nutrition;app.innerHTML=`<h2>Ernährung & Gewicht</h2><p class="sub">${n.length} importierte Einträge · Neue Tageswerte hinzufügen</p><section class="card"><div class="stack"><label>Datum <input class="field" id="date" type="date" value="${today()}"></label>${[['weight','Gewicht (kg)'],['calories','Kalorien'],['protein','Protein (g)'],['carbs','Kohlenhydrate (g)'],['fat','Fett (g)']].map(([k,l])=>`<label>${l}<input class="field" id="${k}" type="number" step="any" placeholder="–"></label>`).join('')}<button class="primary" id="add">Tageswerte speichern</button></div></section><h2>Letzte Einträge</h2>`+n.slice(-20).reverse().map(x=>`<div class="card"><b>${datefmt(x.date)}</b><div class="sub muted">${x.weight??'–'} kg · ${x.calories??'–'} kcal · ${x.protein??'–'} g Protein · ${x.carbs??'–'} g KH · ${x.fat??'–'} g Fett</div></div>`).join('');document.querySelector('#add').onclick=()=>{let o={date:document.querySelector('#date').value};for(let k of ['weight','calories','protein','carbs','fat']){let v=document.getElementById(k).value;o[k]=v===''?null:Number(v)}state.nutrition.push(o);save();render()}}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
