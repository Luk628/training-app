<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Mein Training</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f3f6fa;background:#10151e}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(155px + env(safe-area-inset-bottom))}header{padding:24px 20px 12px}h1{font-size:27px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}p,small{color:#a5b0c2}.sub{font-size:13px}main{padding:0 16px}.card{background:#1c2532;border:1px solid #303c4b;border-radius:17px;padding:16px;margin:12px 0}.muted{color:#a5b0c2}.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.plan{border:1px solid #3c4c5d;background:#1c2532;color:#fff;text-align:center;padding:17px 5px;border-radius:14px;min-height:90px;font-weight:700}.plan span{display:block;font-size:12px;font-weight:400;color:#9eafc4;margin-top:7px}button{font:inherit;cursor:pointer}button.primary{background:#9ee6bd;color:#102016;border:0;border-radius:12px;padding:12px 16px;font-weight:750}button.secondary{background:#303d4c;color:white;border:0;border-radius:10px;padding:10px}button.danger{color:#ff9d9d}.setrow{display:grid;grid-template-columns:26px 1fr 1fr 45px;align-items:center;gap:8px;margin:10px 0}.setrow input,.field{display:block;min-width:0;width:100%;max-width:100%;background:#101924;border:1px solid #46576b;border-radius:10px;padding:12px 7px;color:#fff;font-size:17px;text-align:center;min-height:47px}.setrow button{border:1px solid #5e7185;border-radius:9px;background:#253342;color:#fff;height:42px}.setrow button.done{background:#2e7756;border-color:#77cda0}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:12px;background:#304355;color:#c7d8eb;border-radius:7px;padding:5px 7px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#1b2531;border-top:1px solid #354254;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:2}.nav button{border:0;background:none;color:#9eafc4;font-size:12px;padding:7px 0}.nav button.active{color:#9ee6bd;font-weight:800}.stack{display:grid;gap:9px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#1c2532;border-radius:14px;padding:15px}.stat b{display:block;font-size:24px;margin-top:7px}input[type=date]{color-scheme:dark;-webkit-appearance:none;appearance:none}label{display:block;min-width:0;width:100%}label .field{margin-top:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}hr{border:0;border-top:1px solid #344255;margin:15px 0}details summary{cursor:pointer;font-weight:650}canvas{width:100%;height:180px}.choice{display:flex;align-items:center;gap:7px;margin:12px 0}.choice button{background:#304355;color:white;border:0;border-radius:10px;min-width:38px;height:42px}.choice strong{flex:1;text-align:center;font-size:17px}.choice small{display:block;text-align:center}.hint{font-size:12px;color:#9eafc4}.runfields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style></head><body><header><h1>Mein Training <span style="color:#9ee6bd">●</span></h1><div class="sub muted">Dein persönlicher Trainingsbegleiter</div></header><main id="app"></main><nav class="nav"><button data-tab="train" class="active">🏋️<br>Training</button><button data-tab="history">📅<br>Verlauf</button><button data-tab="progress">📈<br>Fortschritt</button><button data-tab="food">🥗<br>Ernährung</button></nav><script src="data.js"></script><script>
'use strict';const KEY='my-training-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!state.plans)state={plans:SEED.plans,history:SEED.history,nutrition:SEED.nutrition,sessions:[],draft:null};state.history??=[];state.sessions??=[];state.nutrition??=[];state.runs??=[];state.exerciseChoices??={};state.mobilitySessions??=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));save();let tab='train',foodDate=localDate();const app=document.querySelector('#app');function localDate(){return new Date().toLocaleDateString('sv-SE')}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateKey=x=>{let s=String(x??'').trim(),m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})/);if(m)return `${String(+m[3]<100?+m[3]+2000:+m[3])}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'0000-00-00'};const datefmt=x=>{let d=dateKey(x);return d==='0000-00-00'?'Ohne Datum':d.split('-').reverse().join('.')};const num=x=>Number(String(x??'').replace(',','.'));const numberInput=x=>/^\d+(?:[.,]\d+)?$/.test(String(x??'').trim())?num(x):NaN;
function latest(plan,name){return [...state.sessions.filter(s=>s.plan===plan&&s.exercises).flatMap(s=>s.exercises.filter(e=>e.name===name&&!e.skipped).map(e=>({date:s.date,sets:e.sets.filter(x=>!x.skipped)}))),...state.history.filter(h=>h.exercise===name)].sort((a,b)=>dateKey(b.date).localeCompare(dateKey(a.date)))[0]}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({train,history,progress,food})[tab]()}
function makeExercise(plan,i,name){let a=TRAINING_DEFAULTS[name]||[3,'8–12','2 min'];return {name,group:i,target:a[1],rest:a[2],sets:Array.from({length:a[0]},()=>({kg:'',reps:'',done:false}))}}
function startPlan(plan){if(plan==='Mobility'){state.draft={plan,date:localDate(),type:'mobility',done:MOBILITY_ROUTINE.map(()=>false)}}else if(plan==='Laufen'){state.draft={plan,date:localDate(),distance:'',pace:'',type:'run'}}else{state.draft={plan,date:localDate(),exercises:TRAINING_GROUPS[plan].map((g,i)=>makeExercise(plan,i,g.options.includes(state.exerciseChoices[plan+'-'+i])?state.exerciseChoices[plan+'-'+i]:g.options[0]))}}save();render()}
function switchExercise(i,step){let d=state.draft,g=TRAINING_GROUPS[d.plan][i],e=d.exercises[i],idx=g.options.indexOf(e.name);let next=g.options[((idx<0?0:idx)+step+g.options.length)%g.options.length];d.exercises[i]=makeExercise(d.plan,i,next);state.exerciseChoices[d.plan+'-'+i]=next;save();render()}
function train(){if(!state.draft){app.innerHTML='<h2>Training starten</h2><div class="plans">'+[['Push','💪','Kraft'],['Pull','🏋️','Kraft'],['Laufen','🏃','Ausdauer'],['Mobility','🧘','Beweglichkeit']].map(([p,icon,sub])=>`<button class="plan" data-plan="${p}">${icon}<br>${p}<span>${sub}</span></button>`).join('')+'</div><p class="sub">Wähle Push, Pull, Laufen oder Mobility. Bei Kraftübungen kannst du nach links oder rechts wischen, um Alternativen auszuwählen.</p>';app.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>startPlan(b.dataset.plan));return}let d=state.draft;if(d.type==='run')return runEditor();if(d.type==='mobility')return mobilityEditor();app.innerHTML=`<div class="topline"><h2>${esc(d.plan)}</h2><span class="tag">${datefmt(d.date)}</span></div><p class="sub">Übungen mit Pfeilen oder Wischbewegung wechseln. Änderungen werden sofort gespeichert.</p>`+d.exercises.map((e,i)=>{let g=TRAINING_GROUPS[d.plan]?.[i],prev=latest(d.plan,e.name);return `<section class="card" data-swipe="${i}"><div class="topline"><span class="tag">${i+1}. ${esc(g?.label||e.name)}</span><span class="tag">${esc(e.target)}</span></div><div class="choice"><button data-switch="${i}" data-step="-1" aria-label="Vorherige Übung">‹</button><strong>${esc(e.name)}</strong><button data-switch="${i}" data-step="1" aria-label="Nächste Übung">›</button></div><small>${(g?.options.indexOf(e.name)??0)+1} von ${g?.options.length||1} Alternativen</small><div class="sub muted" style="margin-top:10px">Pause: ${esc(e.rest)} · Zuletzt: ${prev?prev.sets.map(s=>esc(s.kg)+' kg × '+esc(s.reps)).join(' / '):'–'}</div><button class="secondary" data-skip-ex="${i}" style="margin-top:10px">${e.skipped?'↩ Übung wieder aufnehmen':'⏭ Übung überspringen'}</button>${e.skipped?'<p class="sub">Übersprungen</p>':''}<div class="setrow sub muted"><span></span><span style="text-align:center">kg / +kg</span><span style="text-align:center">Wdh. / s</span><span></span></div>${e.sets.map((s,j)=>`<div class="setrow" style="${e.skipped||s.skipped?'opacity:.45':''}"><span class="muted">${j+1}</span><input type="text" inputmode="decimal" aria-label="Gewicht Satz ${j+1}" data-i="${i}" data-j="${j}" data-f="kg" ${e.skipped||s.skipped?'disabled':''} value="${esc(s.kg)}"><input type="text" inputmode="numeric" aria-label="Wiederholungen Satz ${j+1}" data-i="${i}" data-j="${j}" data-f="reps" ${e.skipped||s.skipped?'disabled':''} value="${esc(s.reps)}"><button class="${s.done?'done':''}" data-done="${i}-${j}" ${e.skipped||s.skipped?'disabled':''}>✓</button></div><button class="secondary" data-skip-set="${i}-${j}" ${e.skipped?'disabled':''} style="font-size:12px;padding:6px 10px;margin:0 0 8px 26px">${s.skipped?'↩ Satz wieder aufnehmen':'Satz überspringen'}</button>`).join('')}</section>`}).join('')+'<div class="row"><button class="primary" id="finish">Training abschließen</button><button class="secondary danger" id="discard">Verwerfen</button></div>';
app.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>switchExercise(+b.dataset.switch,+b.dataset.step));app.querySelectorAll('[data-swipe]').forEach(el=>{let x,y;el.addEventListener('touchstart',ev=>{if(ev.target.closest('input,button'))return;x=ev.touches[0].clientX;y=ev.touches[0].clientY},{passive:true});el.addEventListener('touchend',ev=>{if(x===undefined)return;let dx=ev.changedTouches[0].clientX-x,dy=ev.changedTouches[0].clientY-y;x=undefined;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)switchExercise(+el.dataset.swipe,dx<0?1:-1)},{passive:true})});app.querySelectorAll('[data-skip-ex]').forEach(b=>b.onclick=()=>{let e=d.exercises[+b.dataset.skipEx];e.skipped=!e.skipped;save();render()});app.querySelectorAll('[data-skip-set]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.skipSet.split('-').map(Number),s=d.exercises[i].sets[j];s.skipped=!s.skipped;if(s.skipped)s.done=false;save();render()});app.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{let s=d.exercises[+el.dataset.i].sets[+el.dataset.j],v=el.value.replace(',','.');s[el.dataset.f]=v===''?'':Number.isFinite(Number(v))?Number(v):'';save()});app.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.done.split('-').map(Number);d.exercises[i].sets[j].done=!d.exercises[i].sets[j].done;save();b.classList.toggle('done')});app.querySelector('#finish').onclick=()=>{if(!confirm('Trainingseinheit speichern und abschließen?'))return;state.sessions.push(d);state.draft=null;save();tab='history';render()};app.querySelector('#discard').onclick=discard}
function discard(){if(confirm('Aktuelle Eingaben wirklich verwerfen?')){state.draft=null;save();render()}}
function runEditor(){let d=state.draft;app.innerHTML=`<h2>🏃 Laufen</h2><section class="card stack"><label>Datum<input class="field" type="date" id="run-date" value="${esc(d.date)}"></label><label>Strecke (km)<input class="field" id="distance" type="text" inputmode="decimal" placeholder="z. B. 10,5" value="${esc(d.distance)}"></label><label>Durchschnittliche Pace (min:sek/km)<input class="field" id="pace" type="text" inputmode="text" autocomplete="off" placeholder="z. B. 5:30" value="${esc(d.pace)}"></label><div class="stat">Berechnete Laufzeit<b id="runtime">–</b></div><button class="primary" id="run-save">Lauf speichern</button><button class="secondary danger" id="discard">Verwerfen</button></section>`;const calc=()=>{let dist=numberInput(d.distance),m=/^(\d{1,2}):(\d{2})$/.exec(d.pace||'');if(!Number.isFinite(dist)||dist<=0||!m||+m[2]>=60)return null;let secs=Math.round(dist*(+m[1]*60+ +m[2]));return secs>0?secs:null};const update=()=>{let s=calc();app.querySelector('#runtime').textContent=s===null?'–':`${Math.floor(s/3600)?Math.floor(s/3600)+' Std. ':''}${Math.floor(s%3600/60)} Min. ${String(s%60).padStart(2,'0')} Sek.`};app.querySelector('#run-date').onchange=e=>{if(e.target.value)d.date=e.target.value;save()};for(let k of ['distance','pace'])app.querySelector('#'+k).oninput=e=>{d[k]=e.target.value;save();update()};update();app.querySelector('#run-save').onclick=()=>{let seconds=calc();if(seconds===null){alert('Bitte gültige Strecke und Pace im Format 5:30 eintragen.');return}state.runs.push({date:d.date,distance:numberInput(d.distance),pace:d.pace,seconds});state.draft=null;save();tab='history';render()};app.querySelector('#discard').onclick=discard}
function mobilityEditor(){let d=state.draft;d.done??=MOBILITY_ROUTINE.map(()=>false);app.innerHTML=`<h2>🧘 Mobility</h2><p class="sub">Deine tägliche Beweglichkeitsroutine (ca. 10 Minuten). Dehne angenehm, nicht schmerzhaft.</p><section class="card stack"><label>Datum<input class="field" type="date" id="mob-date" value="${esc(d.date)}"></label>${MOBILITY_ROUTINE.map((e,i)=>`<label class="mobility-item"><input type="checkbox" data-mob="${i}" ${d.done[i]?'checked':''}><span><b>${i+1}. ${esc(e.name)}</b><small style="display:block">${esc(e.target)}</small></span></label>`).join('')}<button class="primary" id="mob-save">Mobility abschließen</button><button class="secondary danger" id="discard">Verwerfen</button></section>`;app.querySelector('#mob-date').onchange=e=>{if(e.target.value)d.date=e.target.value;save()};app.querySelectorAll('[data-mob]').forEach(e=>e.onchange=()=>{d.done[+e.dataset.mob]=e.checked;save()});app.querySelector('#mob-save').onclick=()=>{if(!d.done.some(Boolean)){alert('Bitte mindestens eine absolvierte Übung abhaken.');return}state.mobilitySessions.push({date:d.date,done:[...d.done],exercises:MOBILITY_ROUTINE.map((e,i)=>({...e,done:!!d.done[i]}))});state.draft=null;save();tab='history';render()};app.querySelector('#discard').onclick=discard}
function history(){let sessions=[...state.sessions.filter(s=>s.exercises).map(s=>({date:s.date,plan:s.plan,exercises:s.exercises})),...Object.values(Object.groupBy?Object.groupBy(state.history,h=>h.plan+'|'+h.date):state.history.reduce((a,h)=>{(a[h.plan+'|'+h.date]??=[]).push(h);return a},{})).map(rows=>({date:rows[0].date,plan:rows[0].plan,exercises:rows.map(r=>({name:r.exercise,sets:r.sets}))})),...state.runs.map(r=>({...r,plan:'Laufen'})),...state.mobilitySessions.map(r=>({...r,plan:'Mobility'}))].sort((a,b)=>dateKey(b.date).localeCompare(dateKey(a.date)));app.innerHTML='<h2>Trainingshistorie</h2><p class="sub">Importierte und neu erfasste Einheiten</p>'+sessions.map(s=>`<details class="card"><summary>${esc(s.plan)} <span class="muted">· ${datefmt(s.date)}</span></summary><hr>${s.plan==='Mobility'?`<div>${(s.exercises||[]).map(e=>`<div style="margin:8px 0">${e.done?'✓':'○'} ${esc(e.name)} · ${esc(e.target)}</div>`).join('')}</div>`:s.plan==='Laufen'?`<div>${esc(s.distance)} km · ${esc(s.pace)} min/km · ${Math.floor(s.seconds/60)}:${String(s.seconds%60).padStart(2,'0')} min</div>`:s.exercises.map(e=>`<div style="margin:10px 0"><b>${esc(e.name)}</b><div class="sub muted">${e.skipped?'Übersprungen':e.sets.map(x=>x.skipped?'Satz übersprungen':`${esc(x.kg)} kg × ${esc(x.reps)}`).join(' · ')}</div></div>`).join('')}</details>`).join('')||'<p class="muted">Noch keine Trainings erfasst.</p>'}
function progress(){let entries=[...state.history.map(h=>({name:h.exercise,date:h.date,sets:h.sets})),...state.sessions.filter(s=>s.exercises).flatMap(s=>s.exercises.filter(e=>!e.skipped).map(e=>({name:e.name,date:s.date,sets:e.sets.filter(x=>!x.skipped)})))],names=[...new Set(entries.map(e=>e.name))].sort(),runs=state.runs;app.innerHTML=`<h2>Fortschritt</h2><div class="stats"><div class="stat">Erfasste Übungen<b>${entries.length}</b></div><div class="stat">Trainingstage<b>${new Set([...entries.map(e=>dateKey(e.date)),...runs.map(r=>dateKey(r.date)),...state.mobilitySessions.map(r=>dateKey(r.date))]).size}</b></div><div class="stat">Läufe<b>${runs.length}</b></div><div class="stat">Mobility-Einheiten<b>${state.mobilitySessions.length}</b></div><div class="stat">Laufkilometer<b>${runs.reduce((a,r)=>a+Number(r.distance||0),0).toFixed(1)}</b></div></div><section class="card"><h2>Übungsverlauf</h2>${names.length?`<select id="ex" class="field" style="text-align:left">${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select><p class="sub">Höchstes eingetragenes Zusatz-/Trainingsgewicht pro Einheit</p><canvas id="chart" width="600" height="260"></canvas>`:'<p class="muted">Noch keine Kraftübungen erfasst.</p>'}</section><section class="card"><h2>Datensicherung</h2><p class="sub">Sichere deine gesamten Daten regelmäßig. Lokale Browserdaten können verloren gehen.</p><div class="stack"><button class="primary" id="backup">Backup herunterladen (JSON)</button><button class="secondary" id="csv">Trainingsdaten als CSV exportieren</button><label class="secondary" style="padding:12px;border-radius:10px">Backup wiederherstellen<input type="file" id="restore" accept=".json" style="width:100%;margin-top:8px"></label></div></section>`;
if(names.length){let draw=()=>{let n=app.querySelector('#ex').value,pts=entries.filter(e=>e.name===n).map(e=>({date:e.date,val:Math.max(0,...e.sets.map(s=>Number(s.kg)||0))})).sort((a,b)=>dateKey(a.date).localeCompare(dateKey(b.date))),c=app.querySelector('#chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,600,260);ctx.fillStyle='#a5b0c2';ctx.font='22px system-ui';if(!pts.length)return;let max=Math.max(1,...pts.map(p=>p.val));ctx.fillText(max+' kg',12,30);ctx.fillText('0 kg',12,235);ctx.strokeStyle='#344c60';ctx.beginPath();ctx.moveTo(80,25);ctx.lineTo(80,230);ctx.lineTo(580,230);ctx.stroke();ctx.strokeStyle='#9ee6bd';ctx.lineWidth=4;ctx.beginPath();pts.forEach((p,i)=>{let x=80+(pts.length===1?250:i*500/(pts.length-1)),y=230-p.val/max*185;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()};app.querySelector('#ex').onchange=draw;draw()}
app.querySelector('#backup').onclick=()=>download('training-backup.json',JSON.stringify(state,null,2),'application/json');app.querySelector('#csv').onclick=()=>{let lines=['Datum;Plan;Übung;Satz;Gewicht;Wiederholungen'];[...state.history,...state.sessions.filter(s=>s.exercises).flatMap(s=>s.exercises.map(e=>({date:s.date,plan:s.plan,exercise:e.name,sets:e.sets})))].forEach(h=>h.sets.forEach((s,i)=>lines.push([h.date,h.plan,h.exercise,i+1,s.kg,s.reps].map(v=>String(v??'').replaceAll(';',',')).join(';'))));lines.push('');lines.push('Datum;Plan;Distanz (km);Pace (min/km);Dauer (s)');runs.forEach(r=>lines.push([r.date,'Laufen',r.distance,r.pace,r.seconds].join(';')));lines.push('');lines.push('Datum;Plan;Übung;Erledigt');state.mobilitySessions.forEach(m=>(m.exercises||[]).forEach(e=>lines.push([m.date,'Mobility',e.name,e.done?'Ja':'Nein'].join(';'))));download('training.csv','\ufeff'+lines.join('\n'),'text/csv')};app.querySelector('#restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.plans||!Array.isArray(v.history)||!Array.isArray(v.sessions))throw Error('Ungültige Sicherung');if(confirm('Aktuelle App-Daten durch das Backup ersetzen?')){state=v;state.runs??=[];state.exerciseChoices??={};state.mobilitySessions??=[];save();render()}}catch(err){alert('Backup konnte nicht geladen werden: '+err.message)}}}
const foodFields=['weight','calories','protein','carbs','fat'];function food(){const n=state.nutrition;if(!state.nutritionDrafts||typeof state.nutritionDrafts!=='object'||Array.isArray(state.nutritionDrafts))state.nutritionDrafts={};const existing=[...n].reverse().find(x=>dateKey(x.date)===foodDate),draft=state.nutritionDrafts[foodDate],values=draft??existing??{};app.innerHTML=`<h2>Ernährung & Gewicht</h2><p class="sub">Gewicht morgens eintragen, Ernährung später ergänzen.</p><section class="card"><div class="stack"><label>Datum<input class="field" id="date" type="date" value="${esc(foodDate)}"></label>${[['weight','Gewicht (kg)'],['calories','Kalorien'],['protein','Protein (g)'],['carbs','Kohlenhydrate (g)'],['fat','Fett (g)']].map(([k,l])=>`<label>${l}<input class="field" id="${k}" type="text" inputmode="${k==='calories'?'numeric':'decimal'}" autocomplete="off" value="${esc(values[k]??'')}" placeholder="–"></label>`).join('')}<p id="food-status" class="sub" role="status" aria-live="polite">${draft?'Entwurf automatisch auf diesem Gerät gespeichert.':existing?'Gespeicherte Tageswerte geladen.':'Eingaben werden automatisch zwischengespeichert.'}</p><button class="primary" id="add">Tageswerte speichern</button></div></section><h2>Letzte Einträge</h2>`+n.slice(-20).reverse().map(x=>`<div class="card"><b>${datefmt(x.date)}</b><div class="sub muted">${esc(x.weight??'–')} kg · ${esc(x.calories??'–')} kcal · ${esc(x.protein??'–')} g Protein · ${esc(x.carbs??'–')} g KH · ${esc(x.fat??'–')} g Fett</div></div>`).join('');const status=app.querySelector('#food-status');for(let k of foodFields)app.querySelector('#'+k).oninput=()=>{const v={};for(let f of foodFields)v[f]=app.querySelector('#'+f).value;state.nutritionDrafts[foodDate]=v;save();status.textContent='Entwurf automatisch auf diesem Gerät gespeichert.'};app.querySelector('#date').onchange=e=>{if(!e.target.value){e.target.value=foodDate;return}foodDate=e.target.value;food()};app.querySelector('#add').onclick=()=>{let record={date:foodDate};for(let k of foodFields){let v=app.querySelector('#'+k).value.trim();record[k]=v===''?null:numberInput(v);if(Number.isNaN(record[k])){status.textContent='Bitte gültige positive Zahlen eingeben, z. B. 84,75.';app.querySelector('#'+k).focus();return}}if(foodFields.every(k=>record[k]===null)){status.textContent='Bitte mindestens einen Tageswert eintragen.';return}let i=n.findIndex(x=>dateKey(x.date)===foodDate);if(i<0)n.push(record);else{n[i]={...n[i],...record};for(let j=n.length-1;j>i;j--)if(dateKey(n[j].date)===foodDate)n.splice(j,1)}delete state.nutritionDrafts[foodDate];save();food();app.querySelector('#food-status').textContent='Tageswerte gespeichert. Du kannst sie später ergänzen.'}}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='train'&&tab==='train'&&state.draft){state.draft=null;save();window.scrollTo(0,0)}tab=b.dataset.tab;render()});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(()=>{});render();
